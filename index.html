<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doug's Journal</title>
  <meta name="theme-color" content="#49657a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doug's Journal">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --accent:#49657a; --bg:#f5f6f7; --text:#1e252b; --muted:#6c7780; --border:#dfe4e8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      margin:0; width:100%; height:100%; min-height:100vh; min-height:100svh;
      overflow:hidden; background:var(--bg);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
    }
    #appFrame {
      position:fixed; inset:0; width:100%; height:100%; height:100svh;
      border:0; margin:0; padding:0; background:#fff; z-index:1;
    }
    #loading {
      position:fixed; inset:0; z-index:20; display:grid; place-items:center;
      background:var(--bg); transition:opacity .18s ease;
    }
    #loading.hidden { opacity:0; pointer-events:none; }
    .loadingInner { text-align:center; padding:24px; max-width:360px; }
    .mark {
      width:88px; height:88px; border-radius:22px; margin:0 auto;
      display:grid; place-items:center; background:var(--accent); color:#fff;
      font-size:42px; font-weight:800; box-shadow:0 6px 20px rgba(0,0,0,.10);
    }
    .loadingTitle { margin-top:14px; font-size:21px; font-weight:750; }
    .loadingText { margin-top:5px; font-size:14px; color:var(--muted); line-height:1.5; }
    .spinner {
      width:24px; height:24px; margin:18px auto 0;
      border:3px solid #dce4ea; border-top-color:var(--accent);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loadingInner">
      <div class="mark">J</div>
      <div class="loadingTitle">Doug's Journal</div>
      <div id="loadingText" class="loadingText">Opening journal…</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwp8L0guuDD7uK3pS00qiIJy9GUJusKNJumhqFlWqpGnqDBNkYO1fjiPooRYfiUNAUFdw/exec?embed=1&v=journal-1.4-wrapper2"
    title="Doug's Journal"
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write"
  ></iframe>

  <script>
    'use strict';

    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');

    let frameLoaded = false;

    frame.addEventListener('load', () => {
      frameLoaded = true;
      setTimeout(() => loading.classList.add('hidden'), 250);
    });

    setTimeout(() => {
      if (!frameLoaded) {
        loadingText.innerHTML =
          '<strong>The Apps Script page has not loaded inside the GitHub page.</strong><br><br>' +
          'Open the journal backend directly to compare what Google is returning.';
        document.querySelector('.spinner').style.display = 'none';

        const a = document.createElement('a');
        a.href = 'https://script.google.com/macros/s/AKfycbwp8L0guuDD7uK3pS00qiIJy9GUJusKNJumhqFlWqpGnqDBNkYO1fjiPooRYfiUNAUFdw/exec';
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Open backend directly';
        a.style.cssText =
          'display:inline-block;margin-top:14px;padding:10px 14px;border-radius:10px;' +
          'background:#49657a;color:#fff;text-decoration:none;font-weight:650;';
        loadingText.appendChild(document.createElement('br'));
        loadingText.appendChild(a);
      }
    }, 12000);
  </script>
</body>
</html>
